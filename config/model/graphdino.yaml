name: graphdino

encoder:
  name: gin
  hidden_dim: 256
  num_layers: 3
  pool: false

head:
  name: dino
  proj_hidden: 512
  bottleneck_dim: 256
  n_prototypes: 65536
  student_temp: 0.1
  teacher_temp: 0.07
  center_momentum: 0.9
  warmup_teacher_temp: 0.04
  warmup_teacher_temp_epochs: 30

ema_tau: 0.996
ema_tau_base: 0.996
total_steps: 0
freeze_last_layer_epochs: 1
n_views: 4
n_global_views: 2

augment_teacher:
  - {name: node_drop, p: 0.10}
  - {name: edge_drop, p: 0.20}
  - {name: feat_mask, p: 0.10}

augment_student:
  - {name: node_drop, p: 0.20}
  - {name: edge_drop, p: 0.30}
  - {name: feat_mask, p: 0.30}

optimizer:
  lr: 1.25e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-5
  warmup_steps: 1000
